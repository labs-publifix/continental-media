<!--
  CONTINENTAL MEDIA — HERO BLOCK (canonical source)
  THESIS: AI multiplies a real team, it never replaces it — proven in motion in
    the first seconds, not asserted in a headline.
  OWN-WORLD: near-black cinematic ground, full-bleed looping video, electric
    blue (#1E5FFF) anchored to the video's own "IA" capsule, Space Grotesk
    display over Inter body, hairline geometry, near-sharp corners, no pill
    shapes.
  STORY: a marketing/comms/PR agency visitor sees AI dramatized as force
    multiplier for people (not a replacement), reads the claim, then acts via
    two clearly weighted CTAs.
  FIRST VIEWPORT: full-bleed video, content block anchored lower-left,
    cinematic fade-up on load. The transparent-to-video top bar and
    hamburger menu now live in public/blocks/site-header (extracted so
    the menu survives scroll and works on every page, not just this
    one) — this block owns only the video/content stage.
  FORM: precisely brief-pinned (copy, colors, structure, motion) — no concept
    roll, per new-work.md's "brief-pinned direction beats the roll, always"
    and "never run the tournament for a precisely specified narrow request";
    code-led (no image-generation tool available this session).
  FINISH: unreviewed and undocumented is unfinished; this build ends with the
    finish review and every asset carrying its provenance.

  USAGE — this file is the canonical, framework-agnostic source for the hero
  block. To use it on a page:
    1. Link assets/css/tokens.css, then blocks/hero/hero.css, in <head>.
    2. Copy the <section class="cm-hero"> markup below as-is, directly
       after the public/blocks/site-header block (this block no longer
       carries its own top bar/menu/skip-link — site-header provides
       all three, page-wide).
    3. Load blocks/hero/hero.js as a module before </body>.
    4. Preload Space Grotesk + Inter (see public/index.html for the exact
       <link> tags) so the display face is ready before the entrance reveal.
  Asset paths below are root-relative (no leading slash) so the block works
  unmodified from any page at the site root.
-->
<section class="cm-hero" data-cm-hero aria-label="Continental Media — inicio">
  <div class="cm-hero__media" data-cm-hero-media>
    <video
      class="cm-hero__video"
      data-cm-hero-video
      poster="assets/images/hero-poster.jpg"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      aria-hidden="true"
      tabindex="-1"
    >
      <source src="assets/video/hero-background.mp4" type="video/mp4" />
    </video>
    <div class="cm-hero__overlay" aria-hidden="true"></div>
  </div>

  <div class="cm-hero__stage">
    <div class="cm-hero__content">
      <h1 class="cm-hero__title" data-cm-reveal id="cm-hero-heading" tabindex="-1">Multiplica tu capacidad.</h1>
      <p class="cm-hero__subtitle" data-cm-reveal>
        La Inteligencia Artificial no reemplaza tu equipo, lo multiplica.
      </p>
      <p class="cm-hero__body" data-cm-reveal>
        En Continental Media diseñamos soluciones de marketing, comunicación y
        relaciones públicas a la medida de cada cliente, potenciadas por las
        tecnologías más modernas en IA.
      </p>
      <div class="cm-hero__actions" data-cm-reveal>
        <a class="cm-hero__cta cm-hero__cta--primary" href="#servicios">Nuestros Servicios</a>
        <a class="cm-hero__cta cm-hero__cta--secondary" href="#portafolio">Ver Portafolio</a>
      </div>
    </div>
  </div>
</section>
