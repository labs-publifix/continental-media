<!--
  CONTINENTAL MEDIA — CLIENTS MARQUEE BLOCK (canonical source)
  THESIS: 25 years of real, named clients across three regions — proven by
    a wall of actual logos in motion, not a generic "trusted by" claim.
  OWN-WORLD: inherits the hero's world — same near-black ground, same
    restrained blue accent used only on hover/emphasis, same Inter body.
    Logos are monochrome white (their own real files), so the "life" in
    this section comes from motion and hover response, not color.
  FORM: precisely brief-pinned (two opposite-direction infinite rows,
    solid dark background, hover effect, the exact intro line) — no
    concept roll, extending the established hero/nav world per
    new-work.md's "local extension" path, not a new-world exercise.
  ACCESSIBILITY: each row's content is duplicated for the seamless CSS
    loop; the duplicate copy is aria-hidden. Under prefers-reduced-motion
    the animation stops and the layout switches to a static wrapped grid
    showing all 17 logos once, with the duplicates hidden entirely — nothing
    is ever announced twice, and nothing needs motion to be read.

  USAGE — canonical source for this block. To use it on a page:
    1. Link assets/css/tokens.css, then blocks/clients-marquee/clients-marquee.css.
    2. Copy the <section class="cm-clients"> markup below as-is.
    3. Load blocks/clients-marquee/clients-marquee.js as a module (pauses
       the animation when the section is off-screen; purely a perf nicety,
       hover-pause and reduced-motion work without it).
  Asset paths are root-relative (no leading slash), matching the hero block.
-->
